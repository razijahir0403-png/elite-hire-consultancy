<!doctype html>
<html lang="en"
  class="h-full bg-[#F8FAFC] dark:bg-[#121212] text-[#1F2937] dark:text-[#F1F5F9] transition-colors duration-200">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/src/assets/ras.jpeg" />

  <title>Eleventis — Data • Talent • Solutions</title>
  <!-- Script to immediately restore user theme preference and prevent theme flicker -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('eleventis_theme') || localStorage.getItem('recruitix_theme') || localStorage.getItem('theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) { }
    })();
  </script>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
